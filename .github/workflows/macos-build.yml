name: macOS Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    name: Build MeshCom-Guru on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller

      - name: Check Python imports
        run: |
          python - <<'PY'
          import sys
          print("Python:", sys.version)

          import PySide6
          print("PySide6:", PySide6.__version__)

          print("All required Guru imports successful.")
          PY

      - name: Test main.py syntax
        run: |
          python -m py_compile main.py
          echo "main.py syntax check successful."

      - name: Build MeshCom-Guru.app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "MeshCom-Guru" \
            main.py

      - name: Verify macOS application
        run: |
          test -d "dist/MeshCom-Guru.app"
          echo "MeshCom-Guru.app successfully created."
          echo
          ls -lah "dist/MeshCom-Guru.app"
          echo
          file "dist/MeshCom-Guru.app/Contents/MacOS/MeshCom-Guru" || true

      - name: Create macOS package
        run: |
          cd dist
          zip -r "../MeshCom-Guru-macOS-arm64.app.zip" "MeshCom-Guru.app"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: MeshCom-Guru-macOS-arm64
          path: MeshCom-Guru-macOS-arm64.app.zip
          if-no-files-found: error
          retention-days: 30
