name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        shell: powershell
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $version = "0.3.65"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Building MeshCom-Guru version $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --windowed --name MeshCom-Guru main.py

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Create installer
        shell: cmd
        run: |
          iscc /DAPP_VERSION=%APP_VERSION% installer\MeshCom-Guru.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshCom-Guru-Windows-Setup
          path: installer\Output\MeshCom-Guru_v*_Setup.exe

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/MeshCom-Guru_v*_Setup.exe
          generate_release_notes: false
